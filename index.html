            data-action="search"
            title="搜索档案"
            aria-label="搜索档案"
          >
            <i data-lucide="search"></i></button
          ><span class="tool-divider"></span

            ><i data-lucide="bookmark"></i><span>我的收藏</span

            class="icon-button mobile-menu"
            data-action="menu"
            title="展开导航"
            aria-label="展开导航"
            aria-expanded="false"
            aria-controls="mobile-navigation"
          >

          </button>

    <main id="main" tabindex="-1"></main>
    <footer class="site-footer">
      <div class="wrap footer-main">
        <a class="brand footer-brand" href="#/"
          ><img src="assets/logo.jpg" alt="" width="40" height="40" /><span
            ><strong>光体·星际档案馆</strong
            ><small>点亮自己，照亮他人。</small></span
          ></a
        >
        <p>
          保持好奇，也保持求证。<br /><span
            >每一份档案，都是通往未知的坐标。</span
          >
        </p>
        <div class="footer-links">
          <button data-action="about">关于光体</button
          ><button data-action="sources">资料与版权</button
          ><a href="#/library"
            >公开资料索引 <i data-lucide="arrow-up-right"></i
          ></a>
        </div>

      <div class="wrap footer-bottom">
        <span>© 2026 光体·星际档案馆</span
        ><span>一切探索，始于仰望 <i data-lucide="sparkles"></i></span>
      </div>

    <dialog
      id="search-dialog"
      class="search-dialog"
      aria-labelledby="search-heading"
    >
      <div class="dialog-heading">
        <h2 id="search-heading">检索星际档案</h2>
        <button
          class="icon-button"
          data-action="close-dialog"
          aria-label="关闭搜索"
          title="关闭"
        >
          <i data-lucide="x"></i>
        </button>
      </div>
      <form id="search-form" class="search-form">
        <i data-lucide="search"></i
        ><input
          id="search-input"
          type="search"
          name="q"
          placeholder="搜索文明、事件、研究或关键词"
          autocomplete="off"
          aria-label="搜索关键词"
        /><button
          type="submit"
          class="icon-button"
          aria-label="提交搜索"
          title="搜索"
        >
          <i data-lucide="arrow-right"></i>
        </button>
      </form>
      <div id="search-content"></div>
    </dialog>
    <dialog id="info-dialog" class="info-dialog" aria-labelledby="info-title">
      <div class="dialog-heading">
        <h2 id="info-title"></h2>
        <button
          class="icon-button"
          data-action="close-dialog"
          aria-label="关闭"
          title="关闭"
        >
          <i data-lucide="x"></i>
        </button>
      </div>
      <div id="info-content"></div>
    </dialog>
    <dialog id="media-dialog" class="media-dialog" aria-label="档案图像预览">
      <button
        class="icon-button"
        data-action="close-dialog"
        title="关闭图片"
        aria-label="关闭图片"
      >
        <i data-lucide="x"></i></button
      ><img id="media-image" src="assets/nebula.jpg" alt="" width="1200" height="800" />
      <p id="media-caption"></p>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
